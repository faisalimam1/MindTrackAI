{% extends "base.html" %}

{% block title %}Login - AI Powered Mental Health and Personalized Recommendation System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="main-content">
            <div class="text-center mb-4">
                <div class="feature-icon mx-auto">
                    <i class="fas fa-sign-in-alt"></i>
                </div>
                <h2 class="text-dark">Welcome Back</h2>
                <p class="text-muted">Sign in to continue your mental health journey</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Remember me
                    </label>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </div>

                <div class="text-center">
                    <p class="text-muted mb-0">
                        Don't have an account? 
                        <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none">Sign up</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
console.log('🔄 Login page script loading...');

$(document).ready(function() {
    console.log('✅ Document ready - jQuery version:', $.fn.jquery);
    
    const form = $('#loginForm');
    const submitBtn = $('#submitBtn');
    
    if (form.length === 0) {
        console.error('❌ Form not found!');
        return;
    }
    
    console.log('✅ Form found, attaching submit handler');
    
    form.on('submit', function(e) {
        e.preventDefault();
        console.log('🚀 Login form submitted');
        
        const username = $('#username').val().trim();
        const password = $('#password').val();
        
        if (!username || !password) {
            showAlert('Please enter both username and password', 'danger');
            return;
        }
        
        // Disable button and show loading
        submitBtn.prop('disabled', true);
        submitBtn.html('<span class="spinner-border spinner-border-sm me-2"></span>Signing In...');
        
        const formData = {
            username: username,
            password: password
        };
        
        console.log('📤 Sending login request...');
        
        $.ajax({
            url: '{{ url_for("auth.login") }}',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function(response) {
                console.log('✅ Login successful:', response);
                showAlert(response.message, 'success');
                
                setTimeout(function() {
                    const redirectUrl = response.redirect || '{{ url_for("dashboard") }}';
                    console.log('🔀 Redirecting to:', redirectUrl);
                    window.location.href = redirectUrl;
                }, 1500);
            },
            error: function(xhr) {
                console.error('❌ Login failed:', xhr);
                const response = xhr.responseJSON || {};
                showAlert(response.error || 'Login failed. Please try again.', 'danger');
                
                // Re-enable button
                submitBtn.prop('disabled', false);
                submitBtn.html('<i class="fas fa-sign-in-alt me-2"></i>Sign In');
            }
        });
    });
    
    function showAlert(message, type) {
        const alert = $('<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' +
            message +
            '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
            '</div>');
        
        $('.container').prepend(alert);
        
        // Scroll to top to see the alert
        $('html, body').animate({ scrollTop: 0 }, 'fast');
        
        // Auto-dismiss after 5 seconds
        setTimeout(function() {
            alert.alert('close');
        }, 5000);
    }
});
</script>
{% endblock %}
