services:
  db:
    image: postgres:15-alpine
    container_name: mindtrack_postgres
    environment:
      POSTGRES_USER: mindtrack_user
      POSTGRES_PASSWORD: MyStr0ngP@ssw0rd123
      POSTGRES_DB: mindtrack_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindtrack_user -d mindtrack_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: